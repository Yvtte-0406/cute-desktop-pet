<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>阿泠陪你工作</title><link rel="stylesheet" href="style.css"></head><body><main>
<div id="bubble" title="右键气泡可收起，事项仍会保留" role="status" hidden><svg id="bubble-frame" aria-hidden="true"><path/></svg><span id="bubble-text"></span><time id="bubble-deadline" hidden></time><div id="completion-undo" hidden><button id="undo-last" type="button">撤销完成</button></div><div id="reminder-actions" hidden><div class="actions" id="response-main"><button data-response="working">正在做</button><button data-response="snooze">稍后提醒</button><button data-response="complete">已完成</button></div><div id="response-options" hidden><div id="time-choices" role="group" aria-label="下次提醒时间"><button data-duration="10">10分钟</button><button data-duration="30">30分钟</button><button data-duration="45">45分钟</button><button data-duration="60">1小时</button><button data-duration="custom">自选</button></div><input id="response-duration" type="hidden" value="10"><input id="response-custom" type="datetime-local" aria-label="自选提醒时间" hidden><p id="response-warning" class="note" hidden></p><label id="preserve-row" class="reminder" hidden><input id="preserve-deadline" type="checkbox" checked>到截止前也叫我一声</label><div class="actions"><button id="response-confirm" hidden>就这个时间</button><button id="skip-today" type="button" hidden>今天先跳过</button><button id="response-back" class="quiet-link">返回</button></div></div><p id="response-error" role="alert"></p></div></div>
<button id="pending-reminders" hidden aria-label="查看未回应提醒"></button><canvas id="pet" width="720" height="620" aria-label="阿泠，点击抚摸，拖动托起，右键打开菜单"></canvas>
<nav id="orbit" aria-label="桌宠菜单" hidden>
<svg id="orbit-arc" viewBox="0 0 278 110" aria-hidden="true"><path/></svg>
<button data-pane="todos" title="待办" aria-label="待办"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="15" height="17" rx="3"/><path d="M9 4V2h7v2M8 12l3 3 6-7"/></svg><span>待办</span></button>
<button data-pane="size" title="大小" aria-label="大小"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M4 4l6 6M20 20l-6-6"/></svg><span>大小</span></button>
<button data-pane="settings" title="设置" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg><span>设置</span></button>
<button id="quit" title="退出桌宠" aria-label="退出桌宠"><svg viewBox="0 0 24 24"><path d="M12 2v10M7 5a8 8 0 1 0 10 0"/></svg><span>退出</span></button>
</nav>
<section id="panel" hidden><header><strong id="panel-title">待办事项</strong><button id="close" aria-label="收起详情">×</button></header>
<div data-content="todos" hidden>
<nav id="todo-pages" aria-label="事项页面"><button type="button" data-todo-page="list" aria-pressed="true">现有事项</button><button type="button" data-todo-page="add" aria-pressed="false">添加事项</button></nav>
<div id="todo-list-page"><ul id="tasks"></ul></div>
<div id="todo-add-page" hidden><form id="form">
<label for="task">事项名称</label><input id="task" maxlength="500" placeholder="要做什么？" required>
<label class="daily-switch"><input id="task-daily" type="checkbox">每日重复</label>
<label id="deadline-label" for="deadline">截止时间（选填）</label><input id="deadline" type="datetime-local">
<label id="daily-deadline-label" for="daily-deadline" hidden>每日截止时间（选填）</label><input id="daily-deadline" type="time" hidden>
<div class="actions"><button id="task-save" type="submit">添加</button><button id="task-cancel" type="button" hidden>取消</button></div>
</form></div></div>
<div data-content="size" hidden><div class="size-control"><label for="pet-size">桌宠大小 <output id="size-value">100%</output></label><input id="pet-size" type="range" min="40" max="150" step="5" value="100"><button id="size-reset" type="button">恢复默认</button></div></div>
<div data-content="settings" hidden><label class="reminder"><input type="checkbox" id="reminders" checked>启用事项提醒</label><label class="reminder"><input id="autostart" type="checkbox">开机自动启动阿泠</label><p id="startup-status" class="note" role="status"></p><form id="ai-form"><strong>DeepSeek · deepseek-flash</strong><label>API KEY<input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="未填写，仅使用本地提醒"></label><label class="reminder"><input id="ai-enabled" type="checkbox">启用AI理解待办</label><label class="reminder"><input id="ai-dynamic" type="checkbox" checked>允许AI提供优先级建议（不改变指定提醒与截止）</label><label>每日请求上限<input id="ai-limit" type="number" min="1" max="1000" value="60"></label><details><summary>可选月预算与价格</summary><label>月预算（人民币）<input id="ai-month-budget" type="number" min="0" step="0.01" placeholder="留空不限"></label><label>输入价格（元/百万tokens）<input id="ai-input-price" type="number" min="0" step="any" placeholder="按供应商当前价格填写"></label><label>输出价格（元/百万tokens）<input id="ai-output-price" type="number" min="0" step="any"></label></details><p class="note">只发送相关事项及所填时间、工作量。变更合并后分析；本地检测不调用AI。20次提示用量、默认60次上限，失败也计数。月预算按所填价格保守预估，实际以账单为准。预览不启用自动AI。Key在本机加密保存。</p><p id="presence-status" class="note" role="status"></p><div class="actions"><button type="submit">保存设置</button><button type="button" id="ai-preview-button">预览提醒</button><button type="button" id="ai-remove">删除Key</button></div><p id="ai-status" role="status"></p><p id="ai-preview" role="status"></p></form></div>
<p id="error" role="alert"></p></section></main>
<script src="assets/tails-overlap-v2/layout.js"></script><script src="assets/tails-overlap-v2/occlusion.js"></script><script src="sprites.js"></script><script src="motion.js"></script><script src="tail-motion.js"></script><script src="rig.js"></script><script src="menu-arc.js"></script><script src="bubble-frame.js"></script><script src="window-shape.js"></script><script src="todo-model.cjs"></script><script src="renderer.js"></script><script src="reminder-copy.js"></script><script src="reminder-ui.js"></script></body></html>
